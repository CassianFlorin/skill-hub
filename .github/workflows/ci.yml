name: CI

on:
  push:
    branches:
      - master
      - "feature/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

# Cancel superseded runs on a branch/PR to save runner minutes; never cancel
# in-progress runs on master.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "These files are not gofmt-clean:"
            echo "${unformatted}"
            echo "Run 'gofmt -w .' to fix."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

  test:
    name: Test and build
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # The race detector needs a C toolchain, which the Windows runner lacks,
      # so Windows runs a plain test pass while the POSIX platforms run with
      # -race (and produce the coverage profile).
      - name: Test (with race detector)
        if: matrix.os != 'windows-latest'
        run: go test -race -coverprofile=coverage.out ./...

      - name: Test
        if: matrix.os == 'windows-latest'
        run: go test ./...

      - name: Test npm installer
        run: npm test --prefix npm

      - name: Build
        run: go build -v ./cmd/skillhub

      - name: Upload coverage profile
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
