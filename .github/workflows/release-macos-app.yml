name: Release macOS App

# Builds SkillHub.app on tagged releases and attaches it to the GitHub release.
#
# - If the Developer ID signing secrets are configured (see macos/SIGNING.md),
#   the app is signed, notarized, and stapled — it opens with no warnings.
# - Otherwise it falls back to an ad-hoc (unsigned) build, uploaded with an
#   "-unsigned" suffix. Users open it once via right-click -> Open.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the app to (e.g. v1.3.11)"
        required: true

permissions:
  contents: write

jobs:
  package:
    name: Build and attach SkillHub.app
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags needed for the version injected by build.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Detect signing configuration
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "${MACOS_CERTIFICATE}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unsigned build::Signing secrets are not configured (see macos/SIGNING.md). Building an ad-hoc app; users must right-click -> Open on first launch."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.signed == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          set -euo pipefail
          CERT_PATH="${RUNNER_TEMP}/certificate.p12"
          KEYCHAIN="${RUNNER_TEMP}/build.keychain-db"
          echo "${MACOS_CERTIFICATE}" | base64 --decode > "${CERT_PATH}"
          security create-keychain -p "${KEYCHAIN_PWD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PWD}" "${KEYCHAIN}"
          security import "${CERT_PATH}" -k "${KEYCHAIN}" -P "${MACOS_CERTIFICATE_PWD}" \
            -T /usr/bin/codesign
          security list-keychains -d user -s "${KEYCHAIN}" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PWD}" "${KEYCHAIN}" >/dev/null
          rm -f "${CERT_PATH}"

      - name: Build SkillHub.app
        # When the secret is empty, build.sh falls back to ad-hoc signing.
        env:
          SKILLHUB_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: ./macos/build.sh

      - name: Notarize and staple
        if: steps.signing.outputs.signed == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP="macos/build/SkillHub.app"
          KEY_PATH="${RUNNER_TEMP}/notary_key.p8"
          echo "${NOTARY_KEY}" | base64 --decode > "${KEY_PATH}"
          ditto -c -k --keepParent "${APP}" "${RUNNER_TEMP}/notarize.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/notarize.zip" \
            --key "${KEY_PATH}" \
            --key-id "${NOTARY_KEY_ID}" \
            --issuer "${NOTARY_ISSUER_ID}" \
            --wait
          rm -f "${KEY_PATH}"
          xcrun stapler staple "${APP}"
          xcrun stapler validate "${APP}"
          spctl --assess --type execute --verbose=4 "${APP}"

      - name: Package distributable zip
        id: pkg
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            NAME="SkillHub-${TAG}-macos.zip"
          else
            NAME="SkillHub-${TAG}-macos-unsigned.zip"
          fi
          ditto -c -k --keepParent "macos/build/SkillHub.app" "macos/build/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: macos/build/${{ steps.pkg.outputs.name }}
        run: |
          set -euo pipefail
          # The Release workflow creates the GitHub release; wait for it to exist.
          for i in $(seq 1 30); do
            if gh release view "${TAG}" >/dev/null 2>&1; then
              gh release upload "${TAG}" "${ASSET}" --clobber
              echo "Uploaded ${ASSET} to release ${TAG}"
              exit 0
            fi
            echo "Waiting for release ${TAG} to be published… (${i}/30)"
            sleep 10
          done
          echo "::error::Release ${TAG} was not found after waiting 5 minutes."
          exit 1
