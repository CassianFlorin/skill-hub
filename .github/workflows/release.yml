name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Test
        run: go test ./...

      - name: Test npm installer
        run: npm test --prefix npm

      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist

          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<<"${target}"
            name="skillhub_${tag}_${goos}_${goarch}"
            binary="skillhub"
            if [[ "${goos}" == "windows" ]]; then
              binary="skillhub.exe"
            fi

            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X github.com/cassian/skill-hub/internal/cli.Version=${tag}" \
              -o "dist/${name}/${binary}" \
              ./cmd/skillhub

            cp README.md "dist/${name}/README.md"

            if [[ "${goos}" == "windows" ]]; then
              (cd dist && zip -r "${name}.zip" "${name}")
            else
              tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            fi
            rm -rf "dist/${name}"
          done

          (
            cd npm
            npm version "${tag#v}" --no-git-tag-version --allow-same-version
            npm pack --pack-destination ../dist
          )

          (cd dist && shasum -a 256 * > checksums.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Publish npm package
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "Skipping npm publish because NPM_TOKEN is not configured."
            exit 0
          fi

          npm publish --access public

      - name: Publish Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_REPO: CassianFlorin/homebrew-tap
        run: |
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "Skipping Homebrew formula publish because HOMEBREW_TAP_TOKEN is not configured."
            exit 0
          fi

          tap_dir="$(mktemp -d)"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" "${tap_dir}"
          ./scripts/generate-homebrew-formula.sh "${GITHUB_REF_NAME}" dist/checksums.txt "${tap_dir}/Formula/skillhub.rb"

          git -C "${tap_dir}" config user.name "github-actions[bot]"
          git -C "${tap_dir}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${tap_dir}" add Formula/skillhub.rb

          if git -C "${tap_dir}" diff --cached --quiet; then
            echo "Homebrew formula already up to date."
            exit 0
          fi

          git -C "${tap_dir}" commit -m "Update skillhub to ${GITHUB_REF_NAME}"
          git -C "${tap_dir}" push
